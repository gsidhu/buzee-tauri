[package]
name = "buzee"
version = "0.2.1"
description = "Find your documents, effortlessly"
authors = ["Gurjot Sidhu, Guillaume Gielly"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
authors = ["Gurjot Sidhu, Guillaume Gielly"]
license = "MIT"

# OCR is enabled by default. On Windows it uses the in-process native WinRT
# OCR (Windows.Media.Ocr) with Windows.Data.Pdf rasterization for scanned PDFs.
# On macOS it uses the bundled `textra` sidecar. No external tooling is
# downloaded at runtime.
[features]
default = ["ocr"]
ocr = []

[build-dependencies]
tauri-build = { version = "2.0.3", features = [] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
lto = "thin"
codegen-units = 8

[dependencies]
tauri = { version = "2.1.1", features = [] }
tauri-plugin-shell = "2.1.1"
tauri-plugin-updater = { version = "2.1.1", features = ["rustls-tls"] }
tauri-plugin-dialog = "2.1.1"

drag = { path = "./crates/drag", version = "0.4.0", features = [ "serde" ] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1.0"
open = "5.1.1"
dirs = "5.0.1"
diesel = { version = "2.1.4", features = ["sqlite", "r2d2", "chrono", "time"] }
chrono = "0.4.26"
jwalk = "0.8.1"
dotext = "0.1.1"
log = "0.4.21"
log4rs = "1.3"
tauri-plugin-global-shortcut = "2.1.1"
tokio = { version = "1.36.0", features = ["full"] }
tokio-graceful-shutdown = "0.14.3"
futures = "0.3"
epub = "2.1.1"
mobi = "0.8.0"
base64 = "0.21"
serialize-to-javascript = "0.1.1"
pdf-extract = "0.7.7"
xml-rs = "0.8.20"
tantivy = "0.22.0"
csv = "1.3.0"
sha2 = "0.10"
rusqlite = {version ="0.31.0", features = ["bundled"] }
tauri-plugin-os = "2.3.2"

# Native Windows OCR (Windows.Media.Ocr via WinRT). Only compiled on Windows.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
  "Data_Pdf",
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage",
  "Storage_Streams",
  "Win32_System_Com"
] }
